<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeToKroki</title>
</head>

<body>

    <script>
        
        function addScript(s) {
            const script = document.createElement('script');
            script.src = s;
            script.type = "module"
            document.head.appendChild(script);
            return script;
        }

        function checkAddMain() {
            if (loadeds.every(s => s))
                addScript("./dist/index.js");
        }

        const isDev = window.location.hostname.includes("localhost") || window.location.hostname === '127.0.0.1';
        const scriptUrls = [];
        const loadeds = [];
        scriptUrls.forEach(u => {
            if (isDev) {
                u = u.replace(".js", ".dev.js");
            } else {
                u = u.replace(".js", ".min.js");
            }
            loadeds[u] = false;
            addScript(u).onload = () => {
                loadeds[u] = true;
                checkAddMain();
            };
        })

    </script>

    <script type="module" src="dist/index.js"></script>

</body>

</html>
